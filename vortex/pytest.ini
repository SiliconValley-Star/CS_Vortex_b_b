[pytest]
# VORTEX Test Configuration - V19.1 ULTIMATE

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    critical: Critical tests that must always pass
    integration: Integration tests requiring full system
    compliance: .clinerules compliance validation tests
    slow: Tests that take significant time
    asyncio: Async tests requiring event loop

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    --maxfail=5
    --disable-warnings

# Coverage options (if coverage plugin installed)
# addopts = --cov=. --cov-report=html --cov-report=term

# Async support
asyncio_mode = auto

# Timeout for tests (in seconds)
timeout = 60

# Ignore patterns
norecursedirs = .git .tox dist build *.egg output

# Log level
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S